services:
  - type: web
    name: wholesale-bi-system-2
    env: python
    region: oregon
    plan: free
    pythonVersion: "3.12.3"
    buildCommand: "pip install -r requirements.txt"
    startCommand: "streamlit run app/streamlit_app.py --server.port $PORT --server.address 0.0.0.0"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"
